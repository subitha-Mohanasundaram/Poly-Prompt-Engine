[project]
name = "poly-prompt-engine"
version = "0.1.0"
description = "FastAPI-based question variation generation system for National Hackathon 2026."
authors = [{ name = "Poly Prompt Engine Team" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "ollama>=0.4.0",
    "sentence-transformers>=3.3.0",
    "scikit-learn>=1.5.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0"
]

[project.scripts]
poly-prompt-engine = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
